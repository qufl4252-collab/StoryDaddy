<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="아빠와 아이가 함께 만드는 포근한 동화" />
    <meta property="og:title" content="동화나라 아이아빠" />
    <meta property="og:description" content="동화 대화와 동화 작가, 두 개의 이야기 방을 만나보세요." />
    <meta property="og:image" content="https://qufl4252-collab.github.io/StoryDaddy/og.png" />
    <title>동화나라 아이아빠</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="home">
      <div class="moon" aria-hidden="true"></div>
      <section class="welcome intro" aria-labelledby="site-title">
        <p class="eyebrow">아빠와 아이가 함께 만드는 이야기</p>
        <h1 id="site-title">동화나라 아이아빠</h1>
        <p class="status">포근한 이야기를 준비하고 있어요.</p>
      </section>

      <section class="feature-picker" aria-labelledby="feature-title">
        <p class="eyebrow">오늘은 어떤 이야기를 만나볼까요?</p>
        <h2 id="feature-title">이야기 방을 골라주세요</h2>
        <div class="feature-grid">
          <button class="feature-card conversation" type="button">
            <span class="feature-icon" aria-hidden="true">☾</span>
            <strong>동화 대화</strong>
            <span class="description">목소리로 이야기를 만들고<br />끊김 없이 계속 이어가요</span>
            <span class="action">이야기 시작하기</span>
          </button>
          <button class="feature-card writer" type="button">
            <span class="feature-icon" aria-hidden="true">✦</span>
            <strong>동화 작가</strong>
            <span class="description">매일 새로운 주제의 동화를<br />책장처럼 넘겨 읽어요</span>
            <span class="action">오늘의 동화 만나기</span>
          </button>
        </div>
      </section>
    </main>
  </body>
</html>
